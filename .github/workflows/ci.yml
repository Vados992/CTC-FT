name: CTC-FA verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile every Python file
        run: python -m compileall -q -f src tests examples scripts
      - name: Critical static checks
        run: python -m ruff check src tests examples scripts
      - name: Run 149-test suite
        run: python -m pytest
      - name: Validate registry and schemas
        run: python scripts/verify_release.py --skip-tests

