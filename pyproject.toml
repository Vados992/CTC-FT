[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctcfa"
version = "2.1.0"
description = "CTC-FA v2.1 -- Closed Timelike Curve Falsification Architecture"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Vadym Tsinderhoz"}]
license = {text = "Proprietary research source; see LICENSE_IP_NOTICE_v2.1.md"}
keywords = ["general relativity", "closed timelike curves", "causality",
            "chronology protection", "computer algebra", "falsification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "sympy>=1.13,<2",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "mpmath>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5", "ruff>=0.9,<1"]
report = ["reportlab>=4.0", "matplotlib>=3.8", "pdf2image>=1.16"]

[project.scripts]
ctcfa = "ctcfa.cli:main"

[project.urls]
Homepage = "https://github.com/Vados992/CTC-FT"
Repository = "https://github.com/Vados992/CTC-FT"
Documentation = "https://github.com/Vados992/CTC-FT/tree/main/docs"
Issues = "https://github.com/Vados992/CTC-FT/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running symbolic or numerical tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
